description: NEO TECH MOBILITY HOLDINGS LIMITED (Neo Mobility) is a UAE-based B2B electric-mobility
  startup driving sustainable transportation across the MENA region. Neo bundles electric-vehicle
  fleets, charging infrastructure, an integrated fleet/driver/operations/energy management platform,
  driver-safety programs, and human-capital support into a single subscription-based ecosystem —
  delivering EV Delivery-as-a-Service for e-commerce, food delivery, and last-mile logistics, alongside
  e-taxi mobility. The company publishes no public developer or API program; this profile is maintained
  for API Evangelist network discovery.
